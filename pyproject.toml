[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "decide-mcp"
version = "0.1.0"
description = "Bulk decisions with Jev. Keep your agent's context small."
readme = "README.md"
keywords = ["mcp", "classification", "ai-agents", "jev"]
requires-python = ">=3.11"
dependencies = ["mcp>=2.2,<3", "httpx2>=2.13,<3", "pydantic>=2.12,<3"]

[project.urls]
Homepage = "https://github.com/alsoleg89/decide"
Documentation = "https://github.com/alsoleg89/decide/blob/main/docs/usage.md"
Issues = "https://github.com/alsoleg89/decide/issues"
Benchmarks = "https://github.com/alsoleg89/decide/tree/main/benchmarks"

[project.scripts]
decide-mcp = "decide:main"

[tool.setuptools]
py-modules = ["decide"]

[tool.coverage.run]
branch = true
source = ["decide"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[dependency-groups]
dev = [
    "coverage>=7.16.1",
]
